<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta de Embarque - Vuelo de Bautismo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .ticket {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            max-width: 800px;
            width: 100%;
        }
        @media (min-width: 600px) {
            .ticket {
                flex-direction: row;
            }
        }
        .main-content {
            padding: 30px;
            flex: 2;
            border-right: 2px dashed #e0e0e0;
            position: relative;
        }
        .stub {
            padding: 30px;
            flex: 1;
            background-color: #f8f9fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #0056b3;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .airline-name {
            font-size: 24px;
            font-weight: bold;
            color: #0056b3;
        }
        .flight-class {
            background-color: #0056b3;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }
        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .detail-item {
            display: flex;
            flex-direction: column;
        }
        .label {
            font-size: 12px;
            color: #6c757d;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        .value {
            font-size: 18px;
            font-weight: 600;
            color: #343a40;
        }
        .barcode {
            width: 100%;
            height: 60px;
            background: repeating-linear-gradient(
                90deg,
                #000,
                #000 3px,
                #fff 3px,
                #fff 6px,
                #000 6px,
                #000 8px,
                #fff 8px,
                #fff 12px
            );
            margin-top: 20px;
        }
        .qr-placeholder {
            width: 120px;
            height: 120px;
            background-color: #e9ecef;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 2px solid #dee2e6;
        }
        .aircraft-info {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <div class="ticket">
        <div class="main-content">
            <div class="header">
                <div class="airline-name">✈️ AVIACIÓN EXPERIENCES</div>
                <div class="flight-class">VUELO DE BAUTISMO</div>
            </div>
            
            <div class="details-grid">
                <div class="detail-item">
                    <span class="label">Pasajero</span>
                    <span class="value" id="passenger-name">Juan Pérez</span>
                </div>
                <div class="detail-item">
                    <span class="label">Fecha</span>
                    <span class="value" id="flight-date">15 Oct 2026</span>
                </div>
                <div class="detail-item">
                    <span class="label">Embarque</span>
                    <span class="value" id="flight-time">10:45 AM</span>
                </div>
                <div class="detail-item">
                    <span class="label">Reserva</span>
                    <span class="value">#VB-8492</span>
                </div>
                <div class="detail-item">
                    <span class="label">Origen</span>
                    <span class="value">Aeródromo Local</span>
                </div>
                <div class="detail-item">
                    <span class="label">Destino</span>
                    <span class="value">Vuelo Local VFR</span>
                </div>
            </div>

            <div class="aircraft-info">
                <div class="detail-item">
                    <span class="label">Aeronave asignada</span>
                    <span class="value">Tecnam P2010</span>
                </div>
                <div class="detail-item">
                    <span class="label">Estado</span>
                    <span class="value" style="color: #28a745;">Confirmado ✅</span>
                </div>
            </div>
        </div>

        <div class="stub">
            <div class="qr-placeholder">
                <!-- Aquí iría un código QR real -->
                <span style="color: #adb5bd; font-size: 40px;">📱</span>
            </div>
            <div class="detail-item" style="align-items: center; text-align: center;">
                <span class="label">Escaneá para ubicación</span>
                <span class="value" style="font-size: 14px;">Presentar al llegar</span>
            </div>
            <div class="barcode"></div>
        </div>
    </div>

    <!-- Script para leer parámetros de la URL si querés hacerlo dinámico -->
    <script>
        // Esto permite que mandes el link así: 
        // tupagina.github.io/?nombre=Marcos&fecha=20%20Oct&hora=15:00
        const urlParams = new URLSearchParams(window.location.search);
        
        if(urlParams.has('nombre')) {
            document.getElementById('passenger-name').innerText = urlParams.get('nombre');
        }
        if(urlParams.has('fecha')) {
            document.getElementById('flight-date').innerText = urlParams.get('fecha');
        }
        if(urlParams.has('hora')) {
            document.getElementById('flight-time').innerText = urlParams.get('hora');
        }
    </script>
</body>
</html>
